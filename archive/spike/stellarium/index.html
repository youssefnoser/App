<!doctype html>
<!-- THROWAWAY SPIKE: proves Stellarium Web Engine can show the SPHEREx HiPS cube
     and blink our own frames. Not the app. Draft without direction
     (antislop R-37): ENERGY 1 / RHYTHM 1 / MOTION 1. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellarium spike</title>
<style>
  :root { --bg: #000; --panel: #f4f4f4; --ink: #111; --muted: #444; }
  html, body { margin: 0; height: 100%; background: var(--bg); font: 15px/1.4 system-ui, sans-serif; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { position: fixed; left: 16px; top: 16px; max-width: min(360px, calc(100% - 32px));
           background: var(--panel); color: var(--ink); padding: 12px 14px; border-radius: 4px; }
  #panel h1 { font-size: 15px; margin: 0 0 4px; }
  #panel p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  label { display: block; margin: 8px 0 2px; }
  input[type=range] { width: 100%; }
  button { min-height: 44px; min-width: 44px; padding: 0 12px; margin: 4px 4px 0 0; font: inherit; }
  :focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
  #status { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<canvas id="sky" aria-label="Sky view"></canvas>
<div id="panel">
  <h1>Stellarium spike (draft without direction)</h1>
  <p>Background: SPHEREx DR1 all-sky cube from IRSA. Overlay: 6 real Barnard's Star frames, detector 6.</p>
  <label for="wl">Background wavelength: <span id="wl-out">loading</span></label>
  <input id="wl" type="range" min="0" max="101" step="1" value="90">
  <div>
    <button id="play" type="button">Play blink</button>
    <button id="step" type="button">Next frame</button>
    <button id="overlay" type="button" aria-pressed="true">Hide frames</button>
    <button id="stars" type="button" aria-pressed="true">Hide engine stars</button>
  </div>
  <div id="status" role="status">Loading the sky engine.</div>
</div>

<script src="/vendor/stellarium-web-engine/build/stellarium-web-engine.js"></script>
<script>
const HIPS = 'https://irsa.ipac.caltech.edu/data/hips/SPHEREx/spherex_allsky_cube';
const FRAMES = '/.cache/spike-frames/';
const status = document.getElementById('status');
const say = (msg) => { status.textContent = msg; };
window.spike = { ready: false };

// Wavelength of each cube frame, read from the survey's own properties file.
async function loadWavelengths() {
  const txt = await (await fetch(HIPS + '/properties')).text();
  const line = txt.split('\n').find(l => l.startsWith('data_cube_crval3_arr'));
  return line.split('=')[1].trim().split(/\s+/).map(Number);
}

StelWebEngine({
  wasmFile: '/vendor/stellarium-web-engine/build/stellarium-web-engine.wasm',
  canvas: document.getElementById('sky'),
  onReady: async (stel) => {
    const core = stel.core;
    const data = '/vendor/stellarium-web-engine/apps/test-skydata/';
    core.stars.addDataSource({ url: data + 'stars' });
    core.atmosphere.visible = false;   // no daylight washing out the survey
    core.landscapes.visible = false;

    // Step 2: SPHEREx cube as the survey layer. Step 3: wavelength = cube frame.
    core.dss.addDataSource({ url: HIPS });
    const wl = document.getElementById('wl');
    const wlOut = document.getElementById('wl-out');
    let lambdas = [];
    try { lambdas = await loadWavelengths(); } catch (e) { say('Could not read wavelengths from IRSA. The slider still works by frame number.'); }
    const showFrame = () => {
      core.dss.frame = Number(wl.value);
      const l = lambdas[wl.value];
      wlOut.textContent = l ? `${l.toFixed(3)} micron (frame ${wl.value})` : `frame ${wl.value}`;
    };
    wl.addEventListener('input', showFrame);
    showFrame();

    // Step 4: our frames as calibrated photos, one visible at a time.
    let meta;
    try { meta = await (await fetch(FRAMES + 'frames.json')).json(); }
    catch (e) { say('No frames found. Run archive/spike/stellarium/make_frames.py first.'); return; }
    const layer = stel.createLayer({ id: 'spherex-frames', z: 7, visible: true });
    const cal = { ra: meta.ra, dec: meta.dec, orientation: 0, pixscale: meta.pixscale_arcsec };
    const photos = meta.frames.map((f, i) => layer.add('photo', {
      url: new URL(FRAMES + f.png, location.href).href, calibration: cal,
      visible: i === 0, instant: true,
    }));

    let cur = 0, timer = null;
    const show = (i) => {
      photos[cur].visible = false;
      cur = (i + photos.length) % photos.length;
      photos[cur].visible = true;
      say(`Frame ${cur + 1} of ${photos.length}, ${meta.frames[cur].date}`);
    };
    document.getElementById('step').onclick = () => show(cur + 1);
    const playBtn = document.getElementById('play');
    playBtn.onclick = () => {
      if (timer) { clearInterval(timer); timer = null; playBtn.textContent = 'Play blink'; return; }
      timer = setInterval(() => show(cur + 1), 500);
      playBtn.textContent = 'Pause blink';
    };
    const toggle = (btn, getSet, onTxt, offTxt) => {
      btn.onclick = () => {
        const v = !getSet();
        getSet(v);
        btn.setAttribute('aria-pressed', String(v));
        btn.textContent = v ? onTxt : offTxt;
      };
    };
    toggle(document.getElementById('overlay'),
           (v) => v === undefined ? layer.visible : (layer.visible = v), 'Hide frames', 'Show frames');
    toggle(document.getElementById('stars'),
           (v) => v === undefined ? core.stars.visible : (core.stars.visible = v), 'Hide engine stars', 'Show engine stars');

    // Fly to the patch: ICRF direction -> observed frame, then zoom to ~0.25 deg.
    const icrf = stel.s2c(meta.ra * stel.D2R, meta.dec * stel.D2R);
    const obs = stel.convertFrame(stel.observer, 'ICRF', 'OBSERVED', icrf);
    stel.lookAt(obs, 0);
    stel.zoomTo(0.25 * stel.D2R, 0);
    show(0);
    Object.assign(window.spike, { ready: true, stel, core, photos, layer, show, meta });
  },
});
</script>
</body>
</html>
