[project]
name = "spherex-blink"
version = "0.1.0"
description = "SPHEREx blink viewer for the NASA Space Apps 2026 'Planet X and SPHEREx' challenge"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "astropy",
    "astropy-healpix",
    "numpy",
    "scipy",
    "pillow",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
