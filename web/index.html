<!doctype html>
<!-- SPHEREx blink page. Built without a DESIGN.md, so it is a draft without
     direction (antislop R-37): ENERGY 1 / RHYTHM 1 / MOTION 1. Native controls,
     plain copy, visible focus, 44 px targets. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPHEREx blink</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="sky" aria-label="Sky view. Drag to pan, scroll to zoom."></canvas>
<section id="panel" aria-labelledby="panel-title">
  <h1 id="panel-title">SPHEREx blink (draft without direction)</h1>

  <form id="goto" novalidate>
    <div class="row">
      <label>RA (deg)
        <input id="ra" name="ra" type="number" inputmode="decimal" step="any" min="0" max="360" required>
      </label>
      <label>Dec (deg)
        <input id="dec" name="dec" type="number" inputmode="decimal" step="any" min="-90" max="90" required>
      </label>
      <button type="submit">Go</button>
    </div>
    <p id="goto-error" class="error" hidden></p>
  </form>

  <div id="targets" class="row" aria-label="Challenge test targets"></div>

  <div class="row">
    <button id="zoom-in" type="button">Zoom in</button>
    <button id="zoom-out" type="button">Zoom out</button>
  </div>

  <div class="row">
    <button id="prev" type="button">Previous</button>
    <button id="play" type="button">Play blink</button>
    <button id="next" type="button">Next</button>
  </div>
  <label for="detector">Blink within one detector (one colour band)</label>
  <select id="detector">
    <option value="1">Detector 1: 0.74 to 1.12 micron</option>
    <option value="2" selected>Detector 2: 1.10 to 1.65 micron</option>
    <option value="3">Detector 3: 1.64 to 2.42 micron</option>
    <option value="4">Detector 4: 2.42 to 3.82 micron</option>
    <option value="5">Detector 5: 3.81 to 4.42 micron</option>
    <option value="6">Detector 6: 4.41 to 5.00 micron</option>
    <option value="0">All detectors mixed</option>
  </select>
  <p id="step-info"></p>

  <label for="wl">Background wavelength: <span id="wl-out">frame 90</span></label>
  <input id="wl" type="range" min="0" max="101" step="1" value="90">

  <p id="status" role="status" aria-live="polite">Starting the sky view.</p>
  <div id="failed" class="row" hidden>
    <p id="failed-text" class="error"></p>
    <button id="retry" type="button">Try again</button>
  </div>
</section>

<script src="/engine/stellarium-web-engine.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
